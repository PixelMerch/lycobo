name: Deploy Cloudflare
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "重试部署最新的已发布版本"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    concurrency:
      group: deploy-cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lycoboai/web build
      - name: Verify the published release matches the checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 重跑旧版本时避免覆盖较新的生产版本。
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$RELEASE_VERSION" ]]; then
            echo "::error::The requested release is not the latest published stable release."
            exit 1
          fi
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_VERSION}^{commit}")"
          if [[ "$tag_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The release tag and checked out commit do not match."
            exit 1
          fi
          git merge-base --is-ancestor "$tag_sha" origin/main
          ci_result="$(gh run list --workflow ci.yml --commit "$tag_sha" --branch main --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "$ci_result" != success ]]; then
            echo "::error::The released commit must have a successful main CI run."
            exit 1
          fi
      - name: Deploy site and image Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN in the cloudflare-production environment."
            exit 1
          fi
          message="$RELEASE_VERSION $(git rev-parse HEAD)"
          pnpm exec wrangler deploy --config wrangler.jsonc --message "$message"
          pnpm exec wrangler deploy --config wrangler.images.jsonc --message "$message"
          pnpm cf:check:config
      - name: Verify production health
        run: curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 15 https://lycobo.com/api/health/live
