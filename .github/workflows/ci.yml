name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-metadata' || '' }}
  cancel-in-progress: true
jobs:
  quality:
    # Metadata-only edits must neither cancel CI nor overwrite required check results.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Quality metadata only' || 'Quality' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: git diff --exit-code
  browser:
    # Metadata-only edits must neither cancel CI nor overwrite required check results.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Browser metadata only' || 'Browser' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FULL_E2E: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.base_ref == 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full browser regression for branch pushes and releases
        if: env.FULL_E2E == 'true'
        run: pnpm test:e2e
      - name: Core browser smoke tests for development
        if: env.FULL_E2E != 'true'
        run: pnpm test:e2e:smoke
  infrastructure:
    # Metadata-only edits must neither cancel CI nor overwrite required check results.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Infrastructure metadata only' || 'Infrastructure' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lycoboai
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: lycoboai
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lycoboai -d lycoboai"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://lycoboai:local_dev_only@127.0.0.1:55432/lycoboai
      ALLOW_LOCAL_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: git diff --exit-code -- packages/db
      - run: pnpm db:migrate
      - run: pnpm test:integration
