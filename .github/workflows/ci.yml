name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      browser_grep:
        description: "Optional browser test name filter for manual diagnosis; push/PR checks always run the complete suite"
        required: false
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-metadata' || '' }}
  cancel-in-progress: true
jobs:
  quality:
    # Metadata-only edits must neither cancel CI nor overwrite required check results.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Quality metadata only' || 'Quality' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 中文注释检查要和规则起点提交比较，需要完整的 git 历史。
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: git diff --exit-code
  browser:
    # Metadata-only edits must neither cancel CI nor overwrite required check results.
    name: Browser shard ${{ matrix.shard }}/2
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    timeout-minutes: 40
    env:
      BROWSER_GREP: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_grep || '' }}
      FULL_E2E: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.base_ref == 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm exec playwright --version
      - name: Full browser regression for branch pushes and releases
        if: env.FULL_E2E == 'true'
        run: |
          if [ -n "$BROWSER_GREP" ]; then
            pnpm test:e2e --shard=${{ matrix.shard }}/2 --grep "$BROWSER_GREP" --pass-with-no-tests
          else
            pnpm test:e2e --shard=${{ matrix.shard }}/2
          fi
      - name: Core browser smoke tests for development
        if: env.FULL_E2E != 'true'
        run: pnpm test:e2e:smoke --shard=${{ matrix.shard }}/2
  browser-result:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Browser metadata only' || 'Browser' }}
    needs: browser
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Require both complete browser shards
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success
  infrastructure:
    # Metadata-only edits must neither cancel CI nor overwrite required check results.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Infrastructure metadata only' || 'Infrastructure' }}
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lycoboai
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: lycoboai
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lycoboai -d lycoboai"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://lycoboai:local_dev_only@127.0.0.1:55432/lycoboai
      ALLOW_LOCAL_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: git diff --exit-code -- packages/db
      - run: pnpm db:migrate
      - run: pnpm test:integration
