name: Deploy CloudBase
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-cloudbase-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudbase-production
    env:
      CLOUDBASE_ENV_ID: lycobo-d9gyvxkegc54a1257
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Require the latest main revision and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=1" --jq '.workflow_runs[0].conclusion')" = success
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Prepare static frontend package
        run: node scripts/cloudbase/prepare-web.mjs "$RUNNER_TEMP/lycobo-cloudbase-web"
      - name: Install pinned CloudBase CLI
        run: npm install --global @cloudbase/cli@3.8.11
      - name: Authenticate deployment identity
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          test -n "$TCB_SECRET_ID" || { echo '::error::Set TCB_SECRET_ID in cloudbase-production'; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo '::error::Set TCB_SECRET_KEY in cloudbase-production'; exit 1; }
          case "$TCB_SECRET_ID" in
            AKID*) ;;
            *) echo '::error::TCB_SECRET_ID must be a Tencent Cloud SecretId, not a CloudBase storage API Key'; exit 1 ;;
          esac
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY" --intl false --json > "$RUNNER_TEMP/cloudbase-login.json"
      - name: Publish the latest main frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$DEPLOY_SHA" = "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          cd "$RUNNER_TEMP/lycobo-cloudbase-web"
          tcb app deploy lycobo-web --env-id "$CLOUDBASE_ENV_ID" --framework static --install-command '' --build-command '' --output-dir ./ --deploy-path / --force --json
      - name: Remove temporary deployment login
        if: always()
        run: |
          if command -v tcb >/dev/null; then tcb logout --json; fi
          rm -f "$RUNNER_TEMP/cloudbase-login.json"
