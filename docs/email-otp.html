<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Lycobo · Your sign-in code</title>
</head>
<body style="margin:0;background:#f3f3f3;color:#171717;font-family:Arial,sans-serif">
  <span style="display:none;max-height:0;overflow:hidden;opacity:0">Enter your 6-digit code on the Lycobo sign-in page.</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#f3f3f3">
    <tr>
      <td align="center" style="padding:28px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:440px">
          <tr>
            <td bgcolor="#191919" style="border:1px solid #383838;border-radius:20px;padding:24px">
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 20px">
                <tr>
                  <td style="padding-right:10px">
                    <img src="https://lycobo.com/brand/lycobo-reveal-icon-192.png" alt="" width="36" height="36" style="display:block;border:0;border-radius:9px">
                  </td>
                  <td style="font-size:20px;line-height:26px;font-weight:700;color:#f5f5f5">Lycobo</td>
                </tr>
              </table>
              <h1 style="margin:0 0 20px;color:#f5f5f5;font-size:24px;line-height:32px">Your sign-in code</h1>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" bgcolor="#252b1c" style="border:1px solid #475734;border-radius:14px;padding:16px 6px;color:#a8ff00;font-family:monospace;font-weight:700;font-size:34px;line-height:44px;letter-spacing:0.15em">{{ .Token }}</td>
                </tr>
              </table>
              <p style="margin:20px 0 0;color:#f5f5f5;font-size:14px;line-height:22px">Enter this code on the Lycobo sign-in page. Keep it private.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 2px 0;color:#5e5e5e;font-size:12px;line-height:19px">
              You can ignore this email if you didn’t request it.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
