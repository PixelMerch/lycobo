<div class="lycobo-landing-feature">
<section class="lycobo-hero" aria-labelledby="lycobo-hero-heading">
  <div class="lycobo-hero-layout">
    <div class="lycobo-hero-copy">
      <h1 id="lycobo-hero-heading">__LYCOBO_HTML_heroHeading__</h1>
      <a class="lycobo-hero-cta" href="/__LYCOBO_LOCALE__/dashboard" data-landing-path="/dashboard">
        __LYCOBO_HTML_heroCreateAction__
      </a>
    </div>
    <div class="lycobo-hero-comparison">
      <figure class="lycobo-hero-image lycobo-hero-original">
        <img src="__LYCOBO_HERO_citrussource__" alt="__LYCOBO_HTML_heroSourceAlt__" width="438" height="438">
        <figcaption>__LYCOBO_HTML_heroSourceLabel__</figcaption>
      </figure>
      <figure class="lycobo-hero-image lycobo-hero-result">
        <img src="__LYCOBO_HERO_citrusresult__" alt="__LYCOBO_HTML_heroResultAlt__" width="438" height="438" fetchpriority="high">
        <figcaption>__LYCOBO_HTML_heroResultLabel__</figcaption>
      </figure>
      <div class="lycobo-hero-reveal" aria-hidden="true">
        <div class="lycobo-hero-reveal-content">
          <div class="lycobo-hero-reveal-original" style="--hero-original: url('__LYCOBO_HERO_citrussource__')"></div>
          <span>__LYCOBO_HTML_heroScrollHint__</span>
        </div>
      </div>
    </div>
  </div>
</section>
<section class="lycobo-showreel" data-landing-showreel aria-labelledby="lycobo-showreel-heading">
  <div class="lycobo-showreel-stage">
    <div class="lycobo-showreel-entrance">
      <h2 class="lycobo-showreel-heading" id="lycobo-showreel-heading">__LYCOBO_HTML_heroShowreelTitle__</h2>
      <div>
        <div class="lycobo-showreel-labels">
          <span id="lycobo-showreel-source-label">__LYCOBO_HTML_heroShowreelSourceLabel__</span>
          <span id="lycobo-showreel-results-label">__LYCOBO_HTML_heroShowreelResultLabel__</span>
        </div>
        <div class="lycobo-showreel-comparison" data-showreel-comparison>
          <input class="lycobo-showreel-range" type="range" min="0" max="100" value="37" aria-label="__LYCOBO_HTML_heroShowreelSliderLabel__" data-showreel-range hidden>
          <div class="lycobo-showreel-divider" aria-hidden="true"><span>↔</span></div>
          <figure class="lycobo-showreel-source" aria-labelledby="lycobo-showreel-source-label">
            <img src="__LYCOBO_HERO_throwsource__" alt="__LYCOBO_HTML_heroShowreelSourceAlt__" width="760" height="760" fetchpriority="low" decoding="async">
          </figure>
          <section class="lycobo-showreel-results" aria-labelledby="lycobo-showreel-results-label">
            <div class="lycobo-showreel-grid">
              <figure class="lycobo-showreel-tile lycobo-showreel-primary" data-showreel-detail>
                <img src="__LYCOBO_HERO_throwbedroom__" alt="__LYCOBO_HTML_heroShowreelBedroomAlt__" width="760" height="760" fetchpriority="low" decoding="async">
                <figcaption>__LYCOBO_HTML_heroShowreelBedroomLabel__</figcaption>
              </figure>
              <figure class="lycobo-showreel-tile" data-showreel-detail>
                <img src="__LYCOBO_HERO_throwsofa__" alt="__LYCOBO_HTML_heroShowreelSofaAlt__" width="760" height="760" fetchpriority="low" decoding="async">
                <figcaption>__LYCOBO_HTML_heroShowreelSofaLabel__</figcaption>
              </figure>
              <figure class="lycobo-showreel-tile" data-showreel-detail>
                <img src="__LYCOBO_HERO_throwtexture__" alt="__LYCOBO_HTML_heroShowreelTextureAlt__" width="760" height="760" fetchpriority="low" decoding="async">
                <figcaption>__LYCOBO_HTML_heroShowreelTextureLabel__</figcaption>
              </figure>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</section>
</div>
