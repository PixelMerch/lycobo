<div class="lycobo-landing-feature">
<section class="lycobo-hero" data-landing-hero aria-labelledby="lycobo-hero-heading">
  <div class="lycobo-hero-stage">
    <div class="lycobo-hero-opening">
      <div class="lycobo-hero-copy">
        <h1 id="lycobo-hero-heading">
          <span>__LYCOBO_HTML_copy115__</span>
          <span>__LYCOBO_HTML_copy116__</span>
        </h1>
        <button class="lycobo-hero-cta" type="button" disabled>
          __LYCOBO_HTML_copy119__
        </button>
      </div>
      <div class="lycobo-hero-photos">
        <div class="lycobo-hero-frame" data-hero-photo="source">
          <figure class="lycobo-hero-visual">
            <img src="__LYCOBO_HERO_source__" alt="__LYCOBO_HTML_heroSourceAlt__" width="1024" height="1024">
            <figcaption class="lycobo-hero-caption">__LYCOBO_HTML_heroSourceLabel__</figcaption>
          </figure>
        </div>
        <div class="lycobo-hero-frame" data-hero-photo="studio">
          <figure class="lycobo-hero-visual">
            <img src="__LYCOBO_HERO_studio__" alt="__LYCOBO_HTML_heroStudioAlt__" width="1280" height="1280" fetchpriority="high">
            <figcaption class="lycobo-hero-caption">__LYCOBO_HTML_previewcopy011__</figcaption>
          </figure>
        </div>
        <div class="lycobo-hero-frame" data-hero-photo="room">
          <figure class="lycobo-hero-visual">
            <img src="__LYCOBO_HERO_room__" alt="__LYCOBO_HTML_heroRoomAlt__" width="1280" height="1024">
            <figcaption class="lycobo-hero-caption">__LYCOBO_HTML_previewcopy013__</figcaption>
          </figure>
        </div>
        <div class="lycobo-hero-frame" data-hero-photo="stitch">
          <figure class="lycobo-hero-visual lycobo-hero-detail">
            <img src="__LYCOBO_HERO_stitch__" alt="__LYCOBO_HTML_heroStitchAlt__" width="1280" height="1024">
            <img class="lycobo-hero-detail-product" src="__LYCOBO_HERO_studio__" alt="" width="1280" height="1280">
            <span class="lycobo-hero-detail-note">__LYCOBO_HTML_heroDetailNote__</span>
            <figcaption class="lycobo-hero-caption">__LYCOBO_HTML_previewcopy015__</figcaption>
          </figure>
        </div>
        <div class="lycobo-hero-frame" data-hero-photo="drape" data-hero-reveal>
          <figure class="lycobo-hero-visual">
            <img src="__LYCOBO_HERO_drape__" alt="__LYCOBO_HTML_heroDrapeAlt__" width="1152" height="1024">
            <figcaption class="lycobo-hero-caption">__LYCOBO_HTML_heroDrapeLabel__</figcaption>
          </figure>
        </div>
        <div class="lycobo-hero-frame" data-hero-photo="folded" data-hero-reveal>
          <figure class="lycobo-hero-visual">
            <img src="__LYCOBO_HERO_folded__" alt="__LYCOBO_HTML_heroFoldedAlt__" width="1152" height="1024">
            <figcaption class="lycobo-hero-caption">__LYCOBO_HTML_heroFoldedLabel__</figcaption>
          </figure>
        </div>
        <div class="lycobo-hero-frame" data-hero-photo="set" data-hero-reveal>
          <figure class="lycobo-hero-visual">
            <img src="__LYCOBO_HERO_set__" alt="__LYCOBO_HTML_heroSetAlt__" width="1280" height="1024">
            <figcaption class="lycobo-hero-caption">__LYCOBO_HTML_previewcopy130__</figcaption>
          </figure>
        </div>
      </div>
    </div>
    <section class="lycobo-hero-results" aria-labelledby="lycobo-set-heading">
      <div class="lycobo-hero-results-content">
        <h2 id="lycobo-set-heading">__LYCOBO_HTML_heroSet__</h2>
        <div class="lycobo-hero-set">
          <div data-hero-slot="source" aria-hidden="true"></div>
          <div class="lycobo-hero-set-grid">
            <div data-hero-slot="studio"></div>
            <div data-hero-slot="room"></div>
            <div data-hero-slot="stitch"></div>
            <div data-hero-slot="drape"></div>
            <div data-hero-slot="folded"></div>
            <div data-hero-slot="set"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</section>
<section class="lycobo-showreel" data-landing-showreel aria-labelledby="lycobo-showreel-heading">
  <div class="lycobo-showreel-stage" data-showreel-stage>
    <div class="lycobo-showreel-media" data-showreel-media>
      <h2 id="lycobo-showreel-heading">__LYCOBO_HTML_heroShowreelTitle__</h2>
      <div class="lycobo-showreel-room" data-showreel-room>
        <img src="__LYCOBO_HERO_model__" alt="__LYCOBO_HTML_heroModelAlt__" width="1536" height="864" loading="lazy">
      </div>
      <section class="lycobo-showreel-specs" data-showreel-specs aria-label="__LYCOBO_HTML_heroSpecsTitle__">
        <picture>
          <source media="(max-width: 700px)" srcset="__LYCOBO_SPECS_tall__" width="900" height="990">
          <img src="__LYCOBO_SPECS_wide__" alt="__LYCOBO_HTML_heroSpecsSheetAlt__" width="1440" height="810" loading="lazy">
        </picture>
        <p class="lycobo-showreel-note">__LYCOBO_HTML_heroSpecsExample__</p>
      </section>
    </div>
  </div>
</section>
</div>
