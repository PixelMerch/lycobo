<section class="lycobo-hero" data-landing-hero aria-labelledby="lycobo-hero-heading">
  <div class="lycobo-hero-stage">
    <div class="lycobo-hero-opening">
      <div class="lycobo-hero-copy">
        <h1 id="lycobo-hero-heading">
          <span>__LYCOBO_HTML_copy115__</span>
          <span>__LYCOBO_HTML_copy116__</span>
        </h1>
        <button class="lycobo-hero-cta" type="button" disabled>
          __LYCOBO_HTML_copy119__
        </button>
      </div>
      <div class="lycobo-hero-strip">
        <div class="lycobo-hero-tile lycobo-hero-tile-source">
          <img src="__LYCOBO_HERO_SOURCE__" alt="__LYCOBO_HTML_heroSourceAlt__" width="1024" height="1408">
        </div>
        <div class="lycobo-hero-studio" data-hero-studio-start>
          <img src="__LYCOBO_HERO_STUDIO__" alt="__LYCOBO_HTML_heroStudioAlt__" width="1024" height="1024" fetchpriority="high">
        </div>
        <div class="lycobo-hero-tile lycobo-hero-tile-scene">
          <img src="__LYCOBO_HERO_SCENE__" alt="__LYCOBO_HTML_heroSceneAlt__" width="1408" height="1024">
        </div>
        <div class="lycobo-hero-tile lycobo-hero-tile-detail">
          <img src="__LYCOBO_HERO_DETAIL__" alt="__LYCOBO_HTML_heroDetailAlt__" width="1408" height="1024">
        </div>
        <div class="lycobo-hero-tile lycobo-hero-tile-band" aria-hidden="true">
          <img src="__LYCOBO_HERO_SOURCE__" alt="" width="1024" height="1408">
        </div>
        <div class="lycobo-hero-tile lycobo-hero-tile-earcup" aria-hidden="true">
          <img src="__LYCOBO_HERO_STUDIO__" alt="" width="1024" height="1024">
        </div>
      </div>
    </div>

    <section class="lycobo-hero-results" aria-label="__LYCOBO_HTML_heroSet__">
      <div class="lycobo-hero-set">
        <figure class="lycobo-hero-result">
          <div class="lycobo-hero-studio" data-hero-studio-end>
            <img src="__LYCOBO_HERO_STUDIO__" alt="__LYCOBO_HTML_heroStudioAlt__" width="1024" height="1024">
          </div>
          <figcaption>__LYCOBO_HTML_heroStudio__</figcaption>
        </figure>
        <div class="lycobo-hero-pair">
          <figure class="lycobo-hero-result">
            <div class="lycobo-hero-result-image">
              <img src="__LYCOBO_HERO_SCENE__" alt="__LYCOBO_HTML_heroSceneAlt__" width="1408" height="1024">
            </div>
            <figcaption>__LYCOBO_HTML_heroScene__</figcaption>
          </figure>
          <figure class="lycobo-hero-result">
            <div class="lycobo-hero-result-image">
              <img src="__LYCOBO_HERO_DETAIL__" alt="__LYCOBO_HTML_heroDetailAlt__" width="1408" height="1024">
            </div>
            <figcaption>__LYCOBO_HTML_heroDetail__</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </div>
</section>
