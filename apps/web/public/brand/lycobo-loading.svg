<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 16 352 224" fill="#fff" role="img">
  <title>Lycobo</title>
  <style>
    .bean { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .mark, .bean, .dot {
        transform-box: fill-box;
        transform-origin: center;
        animation-duration: 2.4s;
        animation-iteration-count: infinite;
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      .mark { animation-name: bite; }
      .bean-first { animation-name: first-bean; }
      .bean-second { animation-name: second-bean; }
      .dot { animation-name: settle-dot; }

      @keyframes bite {
        0%, 17%, 29%, 36%, 49%, 55%, 69%, 100% { transform: none; }
        24%, 44%, 64% { transform: translateX(3px) scaleY(0.95); }
      }
      @keyframes first-bean {
        0% { opacity: 0; transform: translateX(16px) scale(0.8); }
        8%, 12% { opacity: 1; transform: none; }
        22% { opacity: 1; transform: translateX(-36px); }
        27%, 100% { opacity: 0; transform: translateX(-56px) scale(0.18); }
      }
      @keyframes second-bean {
        0% { opacity: 0; transform: translateX(12px) scale(0.8); }
        8%, 14% { opacity: 1; transform: none; }
        30%, 34% { opacity: 1; transform: translateX(-42px); }
        41% { opacity: 1; transform: translateX(-78px); }
        47%, 100% { opacity: 0; transform: translateX(-98px) scale(0.18); }
      }
      @keyframes settle-dot {
        0%, 74%, 100% { transform: none; }
        8%, 14% { transform: translateX(84px) scale(0.75); }
        34% { transform: translateX(42px) scale(0.75); }
        51%, 55% { transform: scale(0.75); }
        64% { transform: translateX(-27px) scale(0.55); }
      }
    }
  </style>
  <path class="mark" d="M211.14 80A96 96 0 1 0 211.14 176L188.62 163A70 70 0 1 1 188.62 93Z"/>
  <circle class="bean bean-first" cx="204" cy="128" r="12"/>
  <circle class="bean bean-second" cx="246" cy="128" r="12"/>
  <circle class="dot" cx="204" cy="128" r="16"/>
</svg>
