name: lycoboai
# Isolated Node development: PostgreSQL outbox and private S3 are local.
services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    stop_grace_period: 90s
    working_dir: /workspace
    command: ["sh", "scripts/local/docker-dev.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      image-storage:
        condition: service_started
    ports:
      - "127.0.0.1:8081:5173"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8791:8791"
    environment:
      S3_ENDPOINT: http://image-storage:8333
      S3_BUCKET: generated-images
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: local-image-dev
      S3_SECRET_ACCESS_KEY: local-image-dev-only
      CI: "true"
      DEV_USE_POLLING: "true"
      DEV_WEB_PUBLIC_PORT: "8081"
      DEV_API_PUBLIC_PORT: "8787"
    volumes:
      - .:/workspace
      # Linux dependencies must never overwrite macOS node_modules.
      - studio-dependencies:/workspace/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/worker/node_modules
      - /workspace/apps/assets/node_modules
      - /workspace/packages/contracts/node_modules
      - /workspace/packages/db/node_modules
      - /workspace/packages/generation/node_modules
      - /workspace/packages/queue/node_modules
      - /workspace/packages/storage/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all(['http://127.0.0.1:5173', 'http://127.0.0.1:8787/api/health/live', 'http://127.0.0.1:8791/health'].map(async u => { const r = await fetch(u); if (!r.ok) throw new Error(String(r.status)); })).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
  image-storage:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command:
      [
        "mini",
        "-dir=/data",
        "-ip=image-storage",
        "-ip.bind=0.0.0.0",
        "-s3.config=/etc/lycobo/s3.json",
      ]
    environment:
      S3_BUCKET: generated-images
    volumes:
      - image-storage-data:/data
      - ./docker-s3-images.json:/etc/lycobo/s3.json:ro
    ports:
      - "127.0.0.1:9004:8333"
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lycoboai
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: lycoboai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lycoboai -d lycoboai"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  image-storage-data:
  postgres-data:
  studio-dependencies:
