name: lycoboai
# Isolated development: PostgreSQL, simulated R2/Images and Redis queues are local.
services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    stop_grace_period: 90s
    working_dir: /workspace
    command: ["sh", "scripts/cloudflare/docker-dev.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:5173"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8787:8787"
    environment:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      DEV_USE_POLLING: "true"
      DEV_WEB_PUBLIC_PORT: "8081"
      DEV_API_PUBLIC_PORT: "8787"
    volumes:
      - .:/workspace
      # Linux dependencies must never overwrite macOS node_modules.
      - studio-dependencies:/workspace/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/apps/worker/node_modules
      - /workspace/apps/assets/node_modules
      - /workspace/packages/contracts/node_modules
      - /workspace/packages/db/node_modules
      - /workspace/packages/generation/node_modules
      - /workspace/packages/queue/node_modules
      - /workspace/packages/storage/node_modules
      - studio-state:/workspace/.wrangler
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['http://127.0.0.1:5173', 'http://127.0.0.1:8787/api/health/live', 'http://127.0.0.1:8790/health'].map(async u => { const r = await fetch(u); if (!r.ok) throw new Error(String(r.status)); })).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lycoboai
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: lycoboai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lycoboai -d lycoboai"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  redis-data:
  studio-dependencies:
  studio-state:
