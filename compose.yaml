name: lycoboai
services:
  api:
    build: &dev-build
      context: .
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /workspace/apps/api
    command: ["node", "--import", "tsx", "--watch", "src/index.ts"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${IMAGE_COMPOSE_DATABASE_URL:-postgresql://lycoboai:local_dev_only@postgres:5432/lycoboai}
      REDIS_URL: redis://redis:6379
      IMAGE_DATA_DIR: /workspace/data/images
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "8787"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${API_PUBLIC_PORT:-8788}:8787"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
      - ./packages/contracts/src:/workspace/packages/contracts/src:ro
      - ./packages/db/src:/workspace/packages/db/src:ro
      - ./packages/generation/src:/workspace/packages/generation/src:ro
      - ./packages/storage/src:/workspace/packages/storage/src:ro
      - ./data/images:/workspace/data/images
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: *dev-build
    init: true
    working_dir: /workspace/apps/worker
    command: ["node", "--import", "tsx", "--watch", "src/index.ts"]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: ${IMAGE_COMPOSE_DATABASE_URL:-postgresql://lycoboai:local_dev_only@postgres:5432/lycoboai}
      REDIS_URL: redis://redis:6379
      IMAGE_DATA_DIR: /workspace/data/images
    volumes:
      - ./apps/worker/src:/workspace/apps/worker/src:ro
      - ./packages/contracts/src:/workspace/packages/contracts/src:ro
      - ./packages/db/src:/workspace/packages/db/src:ro
      - ./packages/generation/src:/workspace/packages/generation/src:ro
      - ./packages/storage/src:/workspace/packages/storage/src:ro
      - ./packages/queue/src:/workspace/packages/queue/src:ro
      - ./data/images:/workspace/data/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build: *dev-build
    init: true
    working_dir: /workspace/apps/web
    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0"]
    environment:
      DEV_API_PROXY_TARGET: http://api:8787
      DEV_USE_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:5173"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/public:/workspace/apps/web/public:ro
      - ./apps/web/index.html:/workspace/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
      - ./packages/contracts/src:/workspace/packages/contracts/src:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lycoboai
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: lycoboai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lycoboai -d lycoboai"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  redis-data:
